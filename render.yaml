# render.yaml — Render Blueprint for HomeHub
# https://render.com/docs/blueprint-spec
#
# Deploy: Push to GitHub → Render Dashboard → New → Blueprint → select repo
# Then set AUTH_USERNAME and AUTH_PASSWORD in the Render Environment tab.

services:
  - type: web
    name: homehub
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: AUTH_USERNAME
        sync: false                  # Set manually in Render Dashboard
      - key: AUTH_PASSWORD
        sync: false                  # Set manually in Render Dashboard
      - key: SECRET_KEY
        generateValue: true          # Auto-generated by Render
      - key: FLASK_ENV
        value: production
