worker_processes 1;

events {
    worker_connections 512;
}

http {
    # ---------- basic settings ----------
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 500M;          # HomeHub handles media uploads

    # ---------- logging ----------
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ---------- upstream: Gunicorn ----------
    upstream homehub {
        server 127.0.0.1:5000;
    }

    server {
        listen 10000;                   # Render routes traffic to this port
        server_name _;

        # ---------- health check (no auth) ----------
        location = /healthz {
            access_log off;
            auth_basic off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ---------- everything else: basic auth ----------
        location / {
            auth_basic           "HomeHub – Login Required";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass         http://homehub;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket support (if needed in future)
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            # Generous timeouts for media downloads / PDF compression
            proxy_read_timeout    300;
            proxy_connect_timeout 60;
            proxy_send_timeout    300;
        }
    }
}
